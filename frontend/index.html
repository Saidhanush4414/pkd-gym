 const inp=(r,k,c,t)=>edit?`<input class="${c||""}" type="${t||"text"}" data-id="${r.id}" data-k="${k}" value="${esc(v(r,k))}">`:null;
 const H=[["name","Customer name"],["mobile","Mobile"],["paid","Paid"],["months","Months"],["due","Due"],["dates","Start – End"],["status","Status"]];
 $("#view").innerHTML=`<div class="bar"><input id="q" placeholder="Search name or mobile" value="${esc(q)}" style="max-width:240px"><select id="st"><option value="">All statuses</option>${Object.keys(SC).map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>
 ${own?(edit?'<button class="btn" id="sa">Save changes</button><button class="btn ghost" id="ca">Cancel</button>':`<button class="btn ghost" id="ed">${ic("edit",16)} Edit</button>`)+`<a class="btn ghost" href="/api/export/customers.csv">${ic("dl",16)} Export CSV</a>`:`<button class="btn" id="nc" style="margin-left:auto">${ic("plus",18)} New customer</button>`}</div>
 ${edit?'<p class="mut">Edit name, mobile, paid, months or Mark as (Completed / Withdrawn). Raising Paid records the difference as a payment today. Changing months recalculates the price and end date.</p>':""}
 <div class="card tw rs">${rows.length?`<table><tr>${H.map(([k,l])=>`<th class="s" data-k="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</th>`).join("")}${own&&edit?"<th>Mark as</th>":""}</tr>
 ${sl.map((r,i)=>`<tr style="--i:${i}"><td>${inp(r,"name","nm")||esc(r.name)}</td><td>${inp(r,"mobile")||r.mobile}</td><td>${inp(r,"paid","","number")||inr(r.paid)}</td><td>${inp(r,"months","","number")||r.months}</td>
 <td>${r.outstanding>0&&!r.closed?`<b style="color:var(--rd)">${inr(r.outstanding)}</b>`:'<span class="mut">—</span>'}</td><td>${r.start} – ${r.end}</td><td><span class="st" style="color:${SC[r.status]}">${r.status}</span></td>
 ${own&&edit?`<td><select data-id="${r.id}" data-k="closed" style="padding:5px 8px"><option value="">Open</option><option ${v(r,"closed")=="Completed"?"selected":""}>Completed</option><option ${v(r,"closed")=="Withdrawn"?"selected":""}>Withdrawn</option></select></td>`:""}</tr>`).join("")}</table>`:'<p class="mut">No customers found.</p>'}</div>
 <div class="bar" style="margin-top:12px"><button class="btn ghost" id="pv">Previous</button><span class="mut">Page ${pg+1} of ${Math.max(1,Math.ceil(rows.length/per))}</span><button class="btn ghost" id="nx">Next</button></div>`;
 $("#pv").onclick=()=>{pg=Math.max(0,pg-1);renderC()};$("#nx").onclick=()=>{if(pg*per+per<rows.length){pg++;renderC()}};
 $("#q").oninput=()=>{pg=0;const p=$("#q").selectionStart;renderC();$("#q").focus();$("#q").setSelectionRange(p,p)};$("#st").onchange=()=>{pg=0;renderC()};
 document.querySelectorAll("th.s").forEach(t=>t.onclick=()=>{sortD=sortK===t.dataset.k?-sortD:1;sortK=t.dataset.k;renderC()});
 document.querySelectorAll("td input,td select[data-k]").forEach(i=>i.oninput=()=>{(edits[i.dataset.id]??={})[i.dataset.k]=i.value});
 if($("#nc"))$("#nc").onclick=()=>go("entry");if($("#ed"))$("#ed").onclick=()=>{edit=true;renderC()};if($("#ca"))$("#ca").onclick=()=>{edit=false;edits={};renderC()};
 if($("#sa"))$("#sa").onclick=async()=>{const ids=Object.keys(edits);if(!ids.length){edit=false;return renderC()}let bad=[];
  for(const id of ids){try{await api("customers/"+id,edits[id],"PATCH")}catch(x){bad.push(`${cache.find(c=>c.id==id).name}: ${x.message}`)}}
  await customers();bell();flash(bad.length?"Some changes were not saved — "+bad.join("; "):"Changes saved.",bad.length?"er":"ok")}}
async function memberships(f){if(f)mf=f;mpg=0;cache=await api("customers");renderM()}
function renderM(){const F=["All","Active","Expiring Soon","Expired","Closed"],cl=r=>r.status=="Completed"||r.status=="Withdrawn",m=(r,x)=>x=="All"||(x=="Closed"?cl(r):r.status==x),cn=x=>cache.filter(r=>m(r,x)).length;
 const rows=cache.filter(r=>m(r,mf)&&(!mq||r.name.toLowerCase().includes(mq)||r.mobile.includes(mq))),per=10,sl=rows.slice(mpg*per,mpg*per+per),D=s=>new Date(s+"T00:00:00");
 $("#view").innerHTML=`<div class="bar sp"><div class="bar" style="margin:0">${F.map(x=>`<button class="pill ${x==mf?"on":""}" data-f="${x}"><i class="dot" style="background:${x=="All"?"var(--cy)":x=="Closed"?"#94a3b8":SC[x]}"></i>${x} (${cn(x)})</button>`).join("")}</div><input id="mq" placeholder="Search members…" value="${esc(mq)}" style="max-width:260px"></div>
 <div class="card tw rs">${sl.length?`<table class="big"><tr><th>#</th><th>Member</th><th>Plan</th><th>Start Date</th><th>End Date</th><th>Days Left</th><th>Progress</th><th>Status</th></tr>${sl.map((r,i)=>{const c=SC[r.status],pr=Math.max(0,Math.min(100,Math.round((Date.now()-D(r.start))/(D(r.end)-D(r.start))*100))),end=r.days_left<0||cl(r);
 return`<tr style="--i:${i}"><td>${mpg*per+i+1}</td><td><div class="mb">${avt(r.name)}<b>${esc(r.name)}</b></div></td><td>${r.months} Months</td><td>${r.start}</td><td>${r.end}</td><td><span class="dy" style="color:${c};background:${c}22">${end?"Ended":r.days_left+" days"}</span></td>
 <td><div class="prg"><div class="pb"><i data-w="${pr}" style="width:0;background:${c}"></i></div><small>${pr}%</small></div></td><td><span class="st" style="color:${c};background:${c}18"><i class="dot" style="background:${c}"></i>${r.status}</span></td></tr>`}).join("")}</table>`:'<p class="mut">No members in this view.</p>'}
 <div class="bar sp" style="margin:14px 0 0"><span class="mut">View ${rows.length?mpg*per+1:0}–${Math.min(rows.length,mpg*per+per)} of ${rows.length} members</span><div class="bar" style="margin:0"><button class="btn ghost" id="mp">‹</button><span class="pill on" style="padding:6px 14px">${mpg+1}</span><button class="btn ghost" id="mn">›</button></div></div></div>`;
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{mf=b.dataset.f;mpg=0;renderM();animBars()});$("#mp").onclick=()=>{mpg=Math.max(0,mpg-1);renderM();animBars()};$("#mn").onclick=()=>{if(mpg*per+per<rows.length){mpg++;renderM();animBars()}};
 $("#mq").oninput=()=>{mq=$("#mq").value.toLowerCase();mpg=0;const p=$("#mq").selectionStart;renderM();$("#mq").focus();$("#mq").setSelectionRange(p,p);animBars()};animBars()}
const monthSel=(d,id)=>`<select id="${id}">${d.months.map(m=>`<option value="${m}" ${m==d.month?"selected":""}>${new Date(m+"-01").toLocaleString("en-IN",{month:"long",year:"numeric"})}</option>`).join("")}</select>`;
async function payments(month){const d=await api("payments"+(month?"?month="+month:"")),pay=d.trainers.reduce((a,t)=>a+t.payout,0),
 card=(c,i,l,v,x,k)=>`<div class="kc ${c} rs" style="--i:${k}"><div class="ib">${ic(i,26)}</div><div><span>${l}</span><b data-n="${v}" data-p="₹">0</b><small>${x}</small></div></div>`;
 $("#view").innerHTML=`<div class="bar sp"><span class="mut">Track collections and trainer payouts</span><div class="bar" style="margin:0">${monthSel(d,"mo")}<button class="btn" id="tx">${ic("list",18)} Transactions</button></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))">${card("t-gr","wallet","Collected this month",d.total,d.tx.length+" payments received",0)}${card("t-bl","users","Trainer payroll",pay,d.trainers.length+" trainers",1)}</div>
 <h3 style="margin:22px 0 10px">Trainer earnings</h3><div class="grid tcs" style="grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))">${d.trainers.map((t,i)=>{const real=Math.round(t.collected/d.bonus_target*100),p=Math.min(100,real);return`<div class="card rs" style="--i:${i+2}"><div class="tc"><div class="av">${esc((t.name[0]||"?").toUpperCase())}</div><div style="flex:1"><b>${esc(t.name)}</b><div class="mut">Collected revenue</div><b class="big2">${inr(t.collected)}</b></div>
 <div style="border-left:1px solid var(--line);padding-left:16px"><div class="mut">Commission rate</div><b class="big2">${t.pct}%</b>${t.collected>=d.bonus_target?'<div class="g" style="font-size:12px">Target reached</div>':""}</div></div><div class="pb"><i data-w="${p}" style="width:0"></i></div><div class="bar sp" style="margin:0"><small style="color:var(--cy)">${inr(t.collected)} / ${inr(d.bonus_target)} (${real}%)</small><small class="${t.collected>=d.bonus_target?"g":""}">${t.collected>=d.bonus_target?"Target reached · "+d.bonus_rate+"% applied":"To reach "+inr(d.bonus_target)}</small></div></div>`}).join("")||'<p class="mut">No trainers yet. Add one in Admin.</p>'}</div>
 <div class="card tw rs" style="margin-top:16px;--i:5"><h3>Trainer pay breakdown</h3>${d.trainers.length?`<table class="big"><tr><th>Trainer</th><th>Members joined</th><th>Amount collected</th><th>Commission rate</th><th>Base pay</th><th>Commission earned</th><th>Total pay</th></tr>
 ${d.trainers.map((t,i)=>`<tr style="--i:${i}"><td>${esc(t.name)}</td><td>${t.joined}</td><td>${inr(t.collected)}</td><td>${t.pct}%${t.collected>=d.bonus_target?' <span class="g">✓</span>':""}</td><td>${inr(t.base)}</td><td>${inr(t.commission)}</td><td><b>${inr(t.payout)}</b></td></tr>`).join("")}</table>`:'<p class="mut">Nothing to show.</p>'}
 <div class="info">Total pay = base pay + commission earned (${d.rate}% of collected). When collected revenue reaches ${inr(d.bonus_target)}, ${d.bonus_rate}% applies to the whole amount. Change these in Admin → Trainer pay. Removed trainers are not listed.</div></div>`;
 $("#mo").onchange=e=>payments(e.target.value);$("#tx").onclick=()=>go("transactions",d.month)}
async function transactions(month){const d=await api("payments"+(month?"?month="+month:""));
 $("#view").innerHTML=back()+`<div class="bar sp">${monthSel(d,"mo")}<span class="mut">${d.tx.length} transactions · ${inr(d.total)}</span></div><div class="card tw">${d.tx.length?`<table class="big"><tr><th>Date</th><th>Customer</th><th>Type</th><th>Method</th><th>Amount</th></tr>${d.tx.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}</td><td>${x.kind}</td><td>${x.method}</td><td style="color:var(--${x.amount<0?"rd":"gr"})">${inr(x.amount)}</td></tr>`).join("")}</table>`:'<p class="mut">No transactions in this month.</p>'}</div>
 <p><a class="btn ghost" href="/api/export/payments.csv">${ic("dl",16)} Download all payments</a></p>`;
 hookBack();$("#mo").onchange=e=>transactions(e.target.value)}

function gate(){$("#view").innerHTML=`<form class="card" id="gf" style="max-width:420px;margin:30px auto;display:grid;gap:12px" autocomplete="off"><div class="ib sm2" style="width:48px;height:48px">${ic("shield",24)}</div><h3 style="margin:0">Admin access</h3><p class="mut" style="margin:0">Enter your owner username and password to open Admin.</p>
 <div><label>Owner username</label><input name="u" autocomplete="off" required></div><div><label>Password</label><input name="p" type="password" autocomplete="new-password" required></div><button class="btn" style="justify-content:center">Unlock Admin</button></form>`;
 $("#gf").onsubmit=async e=>{e.preventDefault();try{await api("admin/verify",{username:e.target.u.value,password:e.target.p.value});admin()}catch(x){flash(x.message,"er")}}}
async function admin(){let tr;try{S=await api("settings");tr=await api("trainers")}catch(x){if(x.data?.locked)return gate();throw x}
 const P=[["fee","Gym fee","wallet"],["trainers","Add trainer","users"],["pay","Trainer pay","rupee"],["account","Account","shield"]];
 $("#view").innerHTML=`<div class="bar sp"><span class="mut">Admin stays unlocked for 15 minutes.</span><button class="btn ghost" id="lu">${ic("clock",18)} Last updates</button></div><div class="adm"><div class="am">${P.map(([k,l,i])=>`<button data-s="${k}" class="${sub===k?"on":""}">${ic(i,18)} ${l}</button>`).join("")}</div><div id="sp"></div></div>`;
 $("#lu").onclick=()=>go("updates");document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;admin()});
 const save=async o=>{try{S=await api("settings",{...S,...o});flash("Saved.");admin()}catch(x){flash(x.message,"er")}},val=i=>+$("#"+i).value;
 if(sub=="fee"){$("#sp").innerHTML=`<div class="card"><h3>Gym fee</h3><div class="form"><div><label>Gym fee per month (₹)</label><input id="sf" type="number" min="1" value="${S.monthly_fee}"></div><div><label>Minimum months to pay in advance</label><input id="sn" type="number" min="1" max="60" value="${S.min_months}"></div></div><p class="sm mut" id="ex"></p><button class="btn" id="sv">Save</button></div>`;
  const ex=()=>$("#ex").innerHTML=`Example: ${inr(val("sf"))} × ${val("sn")} months = <b>${inr(val("sf")*val("sn"))}</b>. If the customer pays ${inr(val("sf")*val("sn")-3000)}, ${inr(3000)} shows as due.`;
  $("#sf").oninput=ex;$("#sn").oninput=ex;ex();$("#sv").onclick=()=>save({monthly_fee:val("sf"),min_months:val("sn")})}
 else if(sub=="trainers"){$("#sp").innerHTML=`<form class="card form" id="tf" autocomplete="off"><h3 style="grid-column:1/-1;margin:0">Add trainer</h3><div><label>Trainer name</label><input name="name" autocomplete="off" required></div><div><label>Username</label><input name="username" autocomplete="off" required></div>
  <div><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div style="align-self:end"><button class="btn">Create trainer</button></div></form>
  <div class="card tw" style="margin-top:14px"><table><tr><th>Name</th><th>Username</th><th>Status</th><th></th></tr>${tr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${x.active?"Active":"Removed"}</td><td><button class="btn ghost" data-u="${x.id}">${x.active?"Remove":"Restore"}</button></td></tr>`).join("")||'<tr><td class="mut" colspan="4">No trainers yet.</td></tr>'}</table></div>`;
  $("#tf").onsubmit=async e=>{e.preventDefault();const f=e.target;try{await api("trainers",{name:f.name.value,username:f.username.value,password:f.password.value});flash("Trainer created.");admin()}catch(x){flash(x.message,"er")}};
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{await api(`trainers/${b.dataset.u}/toggle`,{});admin()})}
 else if(sub=="account"){const a=await api("account");$("#sp").innerHTML=`<div class="card"><h3>Account recovery</h3><p class="mut">Username: <b>${esc(a.username)}</b> · Recovery mobile: <b>${a.mobile||"not set"}</b></p><p class="mut" style="margin-top:0">If you forget your username or password, reset them on the Admin sign-in page with an OTP sent to this number.</p><div id="am"></div></div>`;
  const box=$("#am"),s1=()=>{box.innerHTML=`<div class="form"><div><label>${a.mobile?"New recovery mobile":"Recovery mobile"}</label><input id="am1" inputmode="numeric" maxlength="10" autocomplete="off"></div><div style="align-self:end"><button class="btn" id="as">Send OTP</button></div></div>`;
   $("#as").onclick=async()=>{try{const r=await api("otp/send",{purpose:"mobile",mobile:$("#am1").value});s2($("#am1").value);if(r.dev)flash("No SMS provider is set: the OTP was printed in the server window (development only).")}catch(x){flash(x.message,"er")}}},
  s2=m=>{box.innerHTML=`<div class="form"><div><label>OTP sent to ${esc(m)}</label><input id="ao" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div style="align-self:end"><button class="btn" id="av">Verify & save</button></div></div>`;
   $("#av").onclick=async()=>{try{await api("account/mobile",{mobile:m,otp:$("#ao").value});flash("Recovery mobile saved.");admin()}catch(x){flash(x.message,"er")}}};s1()}
 else{$("#sp").innerHTML=`<div class="card"><h3>Trainer pay</h3><div class="form"><div><label>Base pay per month (₹)</label><input id="bp2" type="number" min="0" value="${S.base_pay}"></div><div><label>Commission on money collected (%)</label><input id="rt" type="number" min="0" max="100" value="${S.rate}"></div>
  <div><label>Higher commission (%)</label><input id="br" type="number" min="0" max="100" value="${S.bonus_rate}"></div><div><label>Higher commission starts when collected reaches (₹)</label><input id="bt" type="number" min="1" value="${S.bonus_target}"></div></div>
  <div class="card sm" id="ex"></div><button class="btn" id="sv">Save</button></div>`;
  const ex=()=>{const a=60000,b=val("bt"),c=(x)=>val("bp2")+x*(x>=b?val("br"):val("rt"))/100;$("#ex").innerHTML=`Collected ${inr(a)} → ${inr(val("bp2"))} + ${a>=b?val("br"):val("rt")}% of ${inr(a)} = <b>${inr(c(a))}</b><br>Collected ${inr(b)} → ${inr(val("bp2"))} + ${val("br")}% of ${inr(b)} = <b>${inr(c(b))}</b>`};
  ["bp2","rt","br","bt"].forEach(i=>$("#"+i).oninput=ex);ex();$("#sv").onclick=()=>save({base_pay:val("bp2"),rate:val("rt"),bonus_rate:val("br"),bonus_target:val("bt")})}}
const LBL={"settings.update":"Settings changed","trainer.create":"Trainer added","trainer.toggle":"Trainer enabled/disabled","customer.create":"Customer added","customer.edit":"Customer edited","payment.add":"Payment recorded","payment.edit":"Paid amount changed","payment.refund":"Refund recorded","membership.renew":"Membership renewed"};
async function updates(){const u=await api("updates");
 const det=r=>{if(r.detail.includes("|"))return`<small>${esc(r.detail.split("|")[1])}</small>`;if(r.action=="settings.update"){try{return Object.entries(JSON.parse(r.detail)).map(([k,v])=>`<span class="chip">${k.replace(/_/g," ")}: ${v}</span>`).join("")}catch(e){}}return`<small>${esc(r.detail)}</small>`};
 $("#view").innerHTML=back()+`<div class="card">${u.length?u.map(r=>`<div class="ev"><div class="ib">${ic(r.action.startsWith("settings")?"shield":r.action.startsWith("payment")?"wallet":"users",18)}</div><div style="flex:1"><b>${r.detail.includes("|")?esc(r.detail.split("|")[0]):LBL[r.action]||esc(r.action)}</b> <small>by ${esc(r.who)} · ${new Date(r.at).toLocaleString("en-IN")}</small><div>${det(r)}</div></div></div>`).join(""):'<p class="mut">No updates recorded yet.</p>'}</div>`;
 hookBack()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
document.querySelector("link[rel=manifest]").href="/manifest.json?p="+PORTAL;
api("me").then(async u=>{if(u.role!==PORTAL)throw 0;me=u;await shell()}).catch(()=>loginView());
</script></body></html>
